<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cristo Redentor · Corcovado</title>
<meta name="description" content="Cena interativa do Cristo Redentor no alto do Corcovado, em three.js, com ciclo de luz do dia.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⛰️</text></svg>">
<style>
  :root{
    --bg:#05070c;
    --panel:rgba(10,14,20,.62);
    --panel-line:rgba(255,255,255,.10);
    --ink:#eef2f6;
    --ink-dim:#9aa6b4;
    --accent:#8fd0ff;
    --r:3px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font:400 13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  canvas{display:block;width:100%;height:100%;outline:none}

  .ui{position:fixed;inset:0;pointer-events:none;z-index:2}
  .ui > *{pointer-events:auto}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;top:12px;right:12px;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:8px 10px;min-width:132px;
    font:500 11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--ink-dim);letter-spacing:.02em;
  }
  .hud b{display:block;color:var(--ink);font-weight:600;font-size:10px;letter-spacing:.09em;
    text-transform:uppercase;margin-bottom:5px;opacity:.62}
  .hud div{display:flex;justify-content:space-between;gap:14px;white-space:nowrap}
  .hud span{color:var(--ink);font-variant-numeric:tabular-nums}
  .hud .warn{color:#ffb37a}

  /* ---------- barra inferior ---------- */
  .bar{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:9px 12px;max-width:calc(100vw - 24px);
  }
  .clock{
    font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--ink);min-width:52px;text-align:center;font-variant-numeric:tabular-nums;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:210px;height:22px;background:transparent;cursor:ew-resize;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:3px;border-radius:2px;
    background:linear-gradient(90deg,#0d1830 0%,#2a4b7c 22%,#cfe0f2 46%,#ffb066 72%,#1b2440 88%,#0d1830 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:50%;
    background:#fff;border:1px solid rgba(0,0,0,.5);box-shadow:0 0 0 1px rgba(255,255,255,.25),0 1px 4px rgba(0,0,0,.6);
  }
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#456}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:none}

  button{
    font:500 12px/1 inherit;color:var(--ink-dim);
    background:rgba(255,255,255,.05);border:1px solid var(--panel-line);border-radius:var(--r);
    padding:7px 9px;cursor:pointer;transition:color .15s,background .15s,border-color .15s;
    white-space:nowrap;
  }
  button:hover{color:var(--ink);background:rgba(255,255,255,.10)}
  button[aria-pressed=true]{color:#07131f;background:var(--accent);border-color:var(--accent)}
  .sep{width:1px;height:22px;background:var(--panel-line)}
  .presets{display:flex;gap:4px}
  .presets button{padding:7px 7px;font-variant-numeric:tabular-nums}

  /* ---------- crédito ---------- */
  .credit{
    position:absolute;left:12px;bottom:14px;max-width:min(46vw,420px);
    background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:7px 10px;font-size:11px;line-height:1.5;color:var(--ink-dim);
  }
  .credit strong{color:var(--ink);font-weight:600}
  .credit .mais{opacity:.72}

  /* ---------- toast ---------- */
  .toast{
    position:absolute;left:50%;bottom:74px;transform:translate(-50%,6px);
    background:var(--accent);color:#07131f;font-weight:600;font-size:12px;
    padding:7px 12px;border-radius:var(--r);opacity:0;transition:opacity .18s,transform .18s;
    pointer-events:none;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- carregando ---------- */
  .loader{
    position:fixed;inset:0;z-index:5;display:grid;place-content:center;gap:14px;justify-items:center;
    background:#05070c;color:var(--ink-dim);transition:opacity .5s;font-size:12px;letter-spacing:.04em;
  }
  .loader.off{opacity:0;pointer-events:none}
  .loader .track{width:180px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
  .loader .fill{height:100%;width:0%;background:var(--accent);transition:width .2s}
  .loader h1{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.10em;text-transform:uppercase}

  .hint{
    position:absolute;top:12px;left:12px;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:7px 10px;font-size:11px;color:var(--ink-dim);transition:opacity .6s;
  }
  .hint.off{opacity:0}
  .hint b{color:var(--ink);font-weight:600}

  /* No celular tudo se empilha: HUD compacto em cima, barra e crédito
     encostados embaixo, sem um cobrir o outro. */
  @media (max-width:640px){
    .hud{top:8px;right:8px;min-width:98px;font-size:9.5px;padding:6px 8px}
    .hud b{font-size:9px;margin-bottom:3px}
    .hint{display:none}
    .bar{left:8px;right:8px;bottom:54px;transform:none;max-width:none;gap:6px;padding:8px}
    input[type=range]{flex:1 1 110px;width:auto;min-width:90px}
    .clock{font-size:13px;min-width:44px}
    button{padding:6px 7px;font-size:11px}
    .presets{gap:3px}
    .sep{display:none}
    .credit{left:8px;right:8px;bottom:8px;top:auto;max-width:none;font-size:9.5px;padding:6px 8px}
    .credit .mais{display:none}
    .toast{bottom:132px}
  }
  @media (prefers-reduced-motion:reduce){
    .toast,.loader,.hint{transition:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="ui" id="ui">
  <div class="hint" id="hint"><b>Arraste</b> para girar · <b>role</b> para aproximar</div>

  <div class="hud" id="hud">
    <b>desempenho</b>
    <div>fps <span id="m-fps">—</span></div>
    <div>draw calls <span id="m-calls">—</span></div>
    <div>triângulos <span id="m-tris">—</span></div>
    <div>transferido <span id="m-mb">—</span></div>
  </div>

  <div class="bar">
    <span class="clock" id="clock">12:00</span>
    <input id="hour" type="range" min="0" max="24" step="0.1" value="12" aria-label="Hora do dia">
    <div class="presets">
      <button data-hour="6" type="button">06h</button>
      <button data-hour="12" type="button">12h</button>
      <button data-hour="17.5" type="button">17h30</button>
      <button data-hour="21" type="button">21h</button>
    </div>
    <span class="sep"></span>
    <button id="rot" type="button" aria-pressed="true" title="Rotação automática">↻ girar</button>
    <button id="ciclo" type="button"
            title="Ciclo de 24 h: a hora avança 1 h por segundo, com o giro ligado"
            aria-pressed="false">☀ ciclo</button>
    <button id="fig" type="button" aria-pressed="true" title="Figura humana de 1,75 m para escala">escala</button>
    <button id="link" type="button" title="Copiar link desta vista">copiar link</button>
  </div>

  <div class="credit">
    <strong>“Christ the Redeemer (Cristo Redentor)”</strong> por Victor Sodré — CC BY.<br>
    <span class="mais">Pedestal, mirante, terreno, nuvens, baía e céu construídos para esta cena.</span>
  </div>

  <div class="toast" id="toast">link copiado</div>
</div>

<div class="loader" id="loader">
  <h1>Cristo Redentor</h1>
  <div class="track"><div class="fill" id="loader-fill"></div></div>
  <div id="loader-txt">carregando o modelo…</div>
</div>

<!-- O GLB sai na frente de tudo: este pedaço roda enquanto o HTML ainda está
     sendo lido, muito antes do primeiro módulo existir. Em 4G isso vale meio
     segundo no tempo até a estátua aparecer. -->
<script>
  window.__glb = fetch('./public/cristo-web-opt.glb', { credentials: 'same-origin' })
    .then((r) => (r.ok ? r.arrayBuffer() : Promise.reject(new Error('GLB ' + r.status))));
</script>
<script type="importmap">
{
  "imports": {
    "three": "./public/vendor/three/three.module.min.js",
    "three/addons/": "./public/vendor/three/addons/"
  }
}
</script>

<!-- Preload só DEPOIS do importmap: se vier antes, a resolução de módulo
     começa sem o mapa e "three" deixa de resolver. -->
<link rel="modulepreload" href="./src/main.js">
<link rel="modulepreload" href="./public/vendor/three/three.module.min.js">
<link rel="modulepreload" href="./public/vendor/three/three.core.min.js">
<link rel="modulepreload" href="./public/vendor/three/addons/controls/OrbitControls.js">
<link rel="modulepreload" href="./public/vendor/three/addons/loaders/GLTFLoader.js">
<link rel="modulepreload" href="./public/vendor/three/addons/loaders/DRACOLoader.js">
<link rel="modulepreload" href="./public/vendor/three/addons/utils/BufferGeometryUtils.js">

<script type="module" src="./src/main.js"></script>
</body>
</html>
